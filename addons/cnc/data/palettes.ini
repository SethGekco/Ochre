; ============================================================
; Command & Conquer palette conventions.
;
; THIS FILE IS WHY THE CORE NEEDS NO GAME KNOWLEDGE. Ochre knows a palette
; may carry named index ranges with a role hint, and renders them. It does
; not know that 16-31 is a house-colour remap ramp -- that fact lives here,
; in the addon, and reaches the core as an opaque label.
;
; A .pal holds SIX-BIT VGA values (0-63). Expansion is (v << 2) | (v >> 4),
; so 63 becomes 255; the shortcut v << 2 gives 252 and clips every channel.
; ============================================================

[Search]
; Where to look for real .pal files. Point this at extracted game assets.
; Missing directories are ignored, and a readable fallback palette is
; synthesised so a SHP still opens -- indices are preserved exactly either
; way, since only the displayed colours are a guess.
Directories = ~/.ochre/cnc-palettes, ./cnc-palettes

[Palette:Default]
; Index 0 is transparency itself: RLE-Zero compresses exactly this value, and
; it CANNOT be stored as an opaque pixel. Protecting it and the remap ramp
; means no quantiser, resampler or nearest-colour match can ever invent them.
Transparent = 0
Protected   = 0, 1, 16-31, 240-254

Annotation.0 = 0,Transparent,transparent
Annotation.1 = 1,Shadow,shadow
Annotation.2 = 16-31,House colour remap,remap
Annotation.3 = 240-254,Unaffected by lighting,nolight

[Palette:unittem]
Transparent = 0
Protected   = 0, 1, 16-31, 240-254
Annotation.0 = 0,Transparent,transparent
Annotation.1 = 1,Shadow,shadow
Annotation.2 = 16-31,House colour remap,remap
Annotation.3 = 240-254,Unaffected by lighting,nolight

[Palette:isotem]
; Terrain palettes have no remap ramp; only transparency is reserved.
Transparent = 0
Protected   = 0
Annotation.0 = 0,Transparent,transparent
