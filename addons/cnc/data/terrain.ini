; ============================================================
; TMP per-tile enumerations.
;
; Note the MANY-TO-ONE mapping: 0, 1 and 13 all display as "Clear", and 2, 3
; and 4 all as "Ice". These are distinct engine values with identical human
; labels, so the addon preserves the original NUMBER on a round-trip and uses
; these names for display only. Normalising them would silently change how a
; tile behaves in game.
; ============================================================

[LandType]
0  = Clear
1  = Clear
2  = Ice
3  = Ice
4  = Ice
5  = Tunnel
6  = Railroad
7  = Rock
8  = Rock
9  = Water
10 = Beach
11 = Road
12 = Road
13 = Clear
14 = Rough
15 = Cliff

[RampType]
; 0 flat; 1-4 single edges; 5-8 outer corners; 9-12 inner corners;
; 13-16 steep corners; 17-20 double ramps along the isometric diagonals.
; Not derivable from the pixels, so it must stay editable.
0  = None
1  = West
2  = North
3  = East
4  = South
5  = North-west
6  = North-east
7  = South-east
8  = South-west
9  = Inner north-west
10 = Inner north-east
11 = Inner south-east
12 = Inner south-west
13 = Steep south-east
14 = Steep south-west
15 = Steep north-west
16 = Steep north-east
17 = Double up SW-NE
18 = Double down SW-NE
19 = Double up NW-SE
20 = Double down NW-SE

[ZData]
; Per-pixel depth: 0-31 valid, 255 no-data, 32-254 invalid. It drives the
; software depth buffer deciding whether a unit draws in front of or behind
; terrain -- wrong z-data makes units walk through cliffs.
Min     = 0
Max     = 31
NoData  = 255
