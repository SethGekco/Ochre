; A worked example. It exists to document the addon API by demonstration and
; to prove the claim the whole design rests on: an addon can add a file
; format, a palette with annotated index ranges, and a command, WITHOUT any
; change to Ochre itself.
;
; Copy this directory to start a real addon.

[Addon]
Id          = example
Name        = Example Addon
Version     = 1.0.0
Author      = Ochre contributors
License     = GPL-3.0-or-later
Description = Demonstrates formats, palettes and commands.
Entry       = __init__.py
Api         = 1.0
Provides    = formats, palettes, commands
Enabled     = on
Order       = 100
