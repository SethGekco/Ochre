; Palette definitions, and the ANNOTATIONS that give their index ranges
; meaning. This file is the addon's, not Ochre's.
;
; This is the seam the whole design turns on. Ochre knows a palette may carry
; named index ranges with a role hint, and renders them. It never learns what
; any of them mean. A real format addon supplies its game's conventions here
; and the core displays them without understanding a word.

[Palette:Demo Ramp]
; A reserved ramp the addon does not want a quantiser to invent.
Protected   = 16-31
Transparent = 0
Annotation.0 = 0-0,Transparent,transparent
Annotation.1 = 16-31,Reserved ramp,example-remap
Annotation.2 = 240-254,Unlit,example-nolight
