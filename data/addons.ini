; ============================================================
; Addon host configuration.
;
; Addons are arbitrary Python. Python cannot sandbox that, and pretending
; otherwise would be worse than useless -- a fake sandbox invites people to
; run things they should not. So the protections here are the ones that
; actually work: nothing runs during a scan, nothing loads until used, the
; content is hashed so a CHANGED addon is re-confirmed, there is a real kill
; switch, and a crash leaves a breadcrumb naming the culprit.
; ============================================================

[Addons]
; Load addons nobody has approved? Off by default: unattended execution of
; unknown code is exactly what should require a decision. A UI overrides this
; per-addon by asking; a headless run inherits the default.
TrustUnknown = off

; Consecutive faults before an addon is disabled for the session. A format
; provider that throws on every sniff would otherwise make the open dialog
; unusable.
FaultBudget  = 3
