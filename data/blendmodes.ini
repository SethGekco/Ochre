; ============================================================
; Blend modes: display names, ordering and grouping.
;
; This file controls what the user SEES and in what order. It cannot change
; what a blend mode computes -- the arithmetic lives in
; ochre/engine/accel/fallback.py because it has to match the optional C
; extension bit-for-bit, and a user-editable expression could not promise
; that. Renaming, reordering, regrouping and hiding are yours; redefining
; multiplication is not.
;
; Set Enabled=off to hide a mode from the UI entirely.
;
; Formulas are Paint.NET's, from OpenPDN (MIT). A is the LOWER layer, B the
; UPPER. See docs/MINING.md.
; ============================================================

[BlendMode:Normal]
Label = Normal
Order = 0
Group = Basic

[BlendMode:Multiply]
Label = Multiply
Order = 10
Group = Darken

[BlendMode:Darken]
Label = Darken
Order = 11
Group = Darken

[BlendMode:ColorBurn]
Label = Color Burn
Order = 12
Group = Darken

[BlendMode:Screen]
Label = Screen
Order = 20
Group = Lighten

[BlendMode:Lighten]
Label = Lighten
Order = 21
Group = Lighten

[BlendMode:ColorDodge]
Label = Color Dodge
Order = 22
Group = Lighten

[BlendMode:Additive]
Label = Additive
Order = 23
Group = Lighten

[BlendMode:Overlay]
Label = Overlay
Order = 30
Group = Contrast

; Reflect, Glow and Negation are Paint.NET-specific and appear in no public
; blend specification. Glow is Reflect with its arguments swapped rather than
; a formula of its own.
[BlendMode:Reflect]
Label = Reflect
Order = 31
Group = Contrast

[BlendMode:Glow]
Label = Glow
Order = 32
Group = Contrast

[BlendMode:Difference]
Label = Difference
Order = 40
Group = Comparative

[BlendMode:Negation]
Label = Negation
Order = 41
Group = Comparative

[BlendMode:Xor]
Label = Xor
Order = 42
Group = Comparative
