; ============================================================
; Effects and adjustments: what is offered, in what order, with what defaults.
;
; Class= names the implementation; a section naming a Class that does not
; exist is skipped, so an addon's effect is simply absent when the addon is.
;
; Any key that is not Class/Label/Order/Category becomes a PROPERTY default,
; lower-cased, coerced by the property's own declared type. That is how an
; effect gains a tuned default without the core learning about it.
;
; The property SCHEMA lives in code, not here, because it is coupled to the
; render function -- an INI-declared property that render() does not read
; would be a silent lie.
; ============================================================

[Effect:brightness_contrast]
Class    = brightness_contrast
Label    = Brightness / Contrast
Category = Adjustments
Order    = 10

[Effect:levels]
Class    = levels
Label    = Levels
Category = Adjustments
Order    = 20

[Effect:hue_saturation]
Class    = hue_saturation
Label    = Hue / Saturation
Category = Adjustments
Order    = 30

[Effect:desaturate]
Class    = desaturate
Label    = Black and White
Category = Adjustments
Order    = 40

[Effect:sepia]
Class    = sepia
Label    = Sepia
Category = Adjustments
Order    = 50

[Effect:invert]
Class    = invert
Label    = Invert Colors
Category = Adjustments
Order    = 60

[Effect:posterize]
Class    = posterize
Label    = Posterize
Category = Adjustments
Order    = 70

[Effect:gaussian_blur]
Class    = gaussian_blur
Label    = Gaussian Blur
Category = Blurs
Order    = 100
radius   = 4

[Effect:sharpen]
Class    = sharpen
Label    = Sharpen
Category = Photo
Order    = 110
amount   = 2

[Effect:add_noise]
Class      = add_noise
Label      = Add Noise
Category   = Noise
Order      = 120
intensity  = 32
monochrome = off

