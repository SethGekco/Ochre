; ============================================================
; Ochre engine settings.
;
; Precedence:  built-in DEFAULTS  <  this file  <  OCHRE_<KEY> env var
;
; Delete a line to fall back to the built-in default. A key that Ochre does
; not recognise is silently ignored, which is deliberate: it means a config
; written by a newer Ochre still opens correctly in an older one.
;
; The built-in defaults live in ochre/engine/settings.py, where the DEFAULTS
; dict is the schema -- the type of each default is the coercion rule.
; ============================================================

[Canvas]
DefaultWidth   = 800
DefaultHeight  = 600
MaxDimension   = 32768

[Display]
; Dirty rects above this count get merged pairwise, choosing the pair whose
; union wastes the least area. Higher = more precise repaints, more overhead.
MaxDirtyRects  = 8
CheckerSize    = 16
CheckerLight   = 200,200,200
CheckerDark    = 160,160,160

[History]
; MaxBytes is compressed delta storage, not resident pixels. MinEntries wins
; over MaxBytes, so a document whose single delta is enormous still gets a
; usable undo depth.
MaxBytes        = 1073741824
MaxEntries      = 200
MinEntries      = 10
; Stroke checkpointing granularity. Blocks are snapshotted uncompressed as a
; stroke first touches them, then compressed once on mouse-up.
BlockSize       = 256
; zlib level 1, deliberately: level 6 costs several times the CPU for a modest
; ratio gain, and this runs on mouse-up where latency is felt.
CompressLevel   = 1
; ~32 MB of live checkpoints before a stroke auto-commits. Stops a pathological
; drag from exhausting memory.
MaxStrokeBlocks = 512

[Frames]
; Frame residency. Warm frames are live arrays, cold are zlib blobs, unloaded
; are still in the .ochre zip and never read. MaxWarmBytes is the real bound --
; cold-frame compression varies hugely with content.
MaxWarmFrames   = 8
MaxWarmBytes    = 1073741824
PreviewMaxDim   = 512
ThawAheadCount  = 2

[Palette]
; Bits per channel in the nearest-colour snap LUT. 5 gives a 32768-cell table
; built in ~194 ms; 6 is more accurate but takes ~1.5 s to build.
SnapBits        = 5

[IndexLocked]
; What happens when an effect would emit off-palette colour on an index-locked
; layer.  refuse | snap | unlock
;
; refuse is the default on purpose: a blur on a 16-colour sprite is almost
; never what the user meant, and silently snapping it destroys the ramp
; semantics that index-locking exists to protect.
EffectPolicy    = refuse

[Effects]
; Effect tiling. numpy releases the GIL inside ufunc calls on arrays above a
; small threshold, so tiles genuinely run in parallel -- but per-tile Python
; overhead HOLDS the GIL. Tiles must be big enough that C work dominates;
; 32x32 would be dispatch-bound and scale negatively.
TileSize        = 256
MaxThreads      = 0

[Planes]
; Plane names the core recognises. Addons append to this; an unlisted name is
; an error rather than a silently orphaned array.
;   rgba   - colour, the only plane the compositor reads
;   index  - palette indices, authoritative on index-locked layers
;   height - example non-colour plane
Known           = rgba,index,height
