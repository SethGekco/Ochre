; ============================================================
; Flat image formats: what each can carry, and how to coerce onto it.
;
; These rules live here rather than as `if ext == ".jpg"` at a call site, so
; adding a format -- or changing the colour JPEG flattens transparency onto --
; is an INI edit rather than a code change.
;
; Alpha      = off means the exporter composites onto Matte first.
; Frames     = on means the format can hold an animation.
; Extensions = what maps to this format, without the dot.
; ============================================================

[Format:PNG]
Extensions = png
Alpha      = on

[Format:BMP]
Extensions = bmp
Alpha      = off
Matte      = 255,255,255

[Format:JPEG]
Extensions = jpg, jpeg
Alpha      = off
Matte      = 255,255,255
Quality    = 92

[Format:GIF]
Extensions = gif
Alpha      = on
Frames     = on

[Format:WEBP]
Extensions = webp
Alpha      = on
Frames     = on

[Format:TIFF]
Extensions = tif, tiff
Alpha      = on

; ---- added with the formats batch ------------------------------------------
; Layered formats (.ochre, .psd, .ora) are handled in code, not here: they
; keep layers, so they are not "flat". These are flat exports and imports.

[Format:AVIF]
Extensions = avif
Alpha      = on
Quality    = 80

[Format:QOI]
Extensions = qoi
Alpha      = on

[Format:TGA]
Extensions = tga
Alpha      = on

[Format:ICO]
Extensions = ico
Alpha      = on

[Format:PPM]
Extensions = ppm, pnm
Alpha      = off
Matte      = 255,255,255

[Format:PCX]
Extensions = pcx
Alpha      = off
Matte      = 255,255,255

[Format:SGI]
Extensions = sgi, rgb
Alpha      = on

[Format:JPEG2000]
Extensions = jp2, j2k
Alpha      = on
Quality    = 90
