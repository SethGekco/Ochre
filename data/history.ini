; ============================================================
; Undo history.
;
; Entries store ONE direction. Undoing captures whatever is currently on the
; canvas into a freshly-built redo entry and only then restores, so undo
; memory is halved and undo/redo cannot drift apart. See
; ochre/engine/commands.py.
; ============================================================

[History]
; Compressed delta storage, not resident pixels. Index-locked layers cost
; roughly a quarter of what plain RGBA ones do, because only the index plane
; is authoritative -- the colour cache is reconstructible and never recorded.
MaxBytes        = 1073741824

MaxEntries      = 200

; A floor that beats MaxBytes. Without it, a document whose single delta is
; larger than the byte budget would evict itself down to no undo at all --
; worse than quietly exceeding a soft memory target.
MinEntries      = 10

; Stroke checkpoint granularity, in pixels. The tradeoff: larger blocks save
; slop around a thin stroke, smaller blocks mean more per-block bookkeeping.
; 256 keeps the hot path to a bool-array lookup.
BlockSize       = 256

; zlib level, deliberately 1. Level 6 costs several times the CPU for a modest
; ratio gain, and this runs on mouse-up where the latency is felt. Measured on
; realistic brush content: 41% at 256x256 in 2.8 ms.
CompressLevel   = 1

; Live checkpoints before a stroke auto-commits and starts accumulating
; afresh. At the default block size that is about 32 MB, which stops a
; pathological drag across a huge canvas from exhausting memory.
MaxStrokeBlocks = 512
