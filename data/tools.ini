; ---- shapes -------------------------------------------------------------
; Shapes redraw from scratch on every mouse-move, restoring from the stroke
; session's scratch buffer first. That buffer is also what becomes the undo
; entry, so the rubber-band preview and the committed result are the same
; pixels and cannot disagree.
;
; style: outline | fill | both.
;   outline  strokes with the primary colour
;   fill     fills with the primary colour -- it is the one the user picked
;   both     outline in primary, fill in SECONDARY, so a two-colour shape
;            is a single drag rather than two
; Shift constrains (square/circle, or 15-degree angles for a line);
; Alt draws from the centre. Both are read live, so toggling mid-drag works.

[Tool:line]
Shortcut   = O
Group      = shape
Icon       = curve
Cursor     = cross
Footprint  = none
Class     = line
Label     = Line / Curve
Order      = 171
stroke    = 2
style     = outline
antialias = on

[Tool:shape]
Group      = shape
Icon       = shape
Shortcut   = O
Cursor     = cross
Footprint  = none
Class      = shape
Label      = Shapes
Order      = 170
; One tool with a choice of shape rather than nine toolbar buttons that
; differ by a dropdown. Anything in shapes.POLYGONS works here, so an addon
; can add a shape without the tool or the UI learning its name:
;   rectangle ellipse triangle diamond pentagon hexagon heptagon octagon
;   star5 star6 star8
shape      = rectangle
stroke     = 2
style      = both
antialias  = on
[Tool:freeform]
Shortcut   = O
Group      = shape
Icon       = freeform
Cursor     = cross
Footprint  = none
Class     = freeform
Label     = Freeform Shape
Order      = 172
stroke    = 2
style     = outline
antialias = on

; ---- gradient -----------------------------------------------------------
; kind:   linear | reflected | diamond | radial | conical
; repeat: clamp | repeat | reflect
;
; alpha_only gradients the ALPHA channel and leaves colour untouched, which
; turns the tool into a soft mask. Most editors do not have this.
;
; The colour ramp is interpolated with alpha weighting, not a per-channel
; lerp: fading to a transparent colour must not drag that colour into the
; visible end of the ramp.

[Tool:gradient]
Group      = fill
Icon       = gradient
Shortcut   = G
Cursor     = cross
Footprint  = none
Class      = gradient
Label      = Gradient
Order      = 111
kind       = linear
repeat     = clamp
alpha_only = off
reverse    = off

; ---- text ---------------------------------------------------------------
; Rasterised in the ENGINE via Pillow's FreeType, not in the UI. The design
; document assumed Qt would have to do this; Pillow is already an engine
; dependency, so text stays headless and scriptable and the engine stays
; Qt-free.
;
; Unlike the shapes, the text session stays OPEN after mouse-up: on_end
; finishes positioning, and the caller keeps editing with set_text() before
; calling commit_text(). Live preview works the same way the shapes' does,
; so what you see while typing is exactly what gets committed.
;
; font is a family name resolved through fontconfig (so "sans-serif" works),
; a face filename, or an absolute path.

[Tool:text]
Group      = text
Icon       = text
Shortcut   = T
Cursor     = ibeam
Footprint  = none
Class        = text
Label        = Text
Order      = 160
font         = DejaVu Sans
size         = 24
align        = left
line_spacing = 1.0
antialias    = on
text         =

; ---- clone and move -----------------------------------------------------
; Clone samples from a SNAPSHOT taken when the stroke begins, not from the
; live layer. Photoshop samples live, which lets a stroke feed on what it
; just painted -- occasionally useful, frequently a runaway smear when source
; and destination overlap. Freezing it per stroke keeps the result
; predictable; earlier strokes are still visible to later ones.
;
; aligned=on keeps the source offset fixed across strokes, so a clone can be
; built up in several passes. off re-anchors on every stroke.

[Tool:clone]
Group      = clone
Icon       = clone
Shortcut   = C
Cursor     = blank
Footprint  = circle
Class    = clone
Label    = Clone Stamp
Order      = 90
size     = 24
hardness = 0.8
spacing  = 0.15
aligned  = on

; Two move tools, deliberately separate. They look identical and do entirely
; different things -- one repositions the marquee, the other repositions
; image content -- and merging them is how people destroy work by accident.
;
; cut=on lifts the pixels, leaving a hole. off copies them instead.
; Shift constrains to the dominant axis, read live.

[Tool:move_pixels]
Group      = move
Icon       = move_pixels
Shortcut   = M
Cursor     = move
Footprint  = none
Class = move_pixels
Label = Move Selected Pixels
Order      = 10
cut   = on

[Tool:move_selection]
Shortcut   = M
Group      = move
Icon       = move_selection
Cursor     = move
Footprint  = none
Class = move_selection
Label = Move Selection
Order      = 11

; The two tools that change nothing about the document. Both actions already
; existed on the wheel and the middle button; these are the toolbar
; affordance for people who reach for a magnifier instead of a chord.
[Tool:zoom]
Group      = zoom
Icon       = zoom
Shortcut   = Z
Cursor     = pointing
Footprint  = none
Class      = zoom
Label      = Zoom
Order      = 200
; How far a drag must travel, in DOCUMENT units, before it means "fill this
; rectangle" rather than "click here". At 800% a few pixels of hand tremor
; is a large document distance, so this is deliberately not a widget-pixel
; threshold.
min_drag   = 4

[Tool:pan]
Group      = pan
Icon       = pan
Shortcut   = H
Cursor     = pointing
Footprint  = none
Class      = pan
Label      = Pan
Order      = 190

