; ============================================================
; Tools: which are offered, in what order, and with what defaults.
;
; Class= names the implementation. A section naming a Class that does not
; exist is silently skipped, so an addon's tool simply is not offered when
; the addon is absent -- rather than the editor refusing to start.
;
; Any key that is not Class/Label/Order/TargetPlane becomes a tool OPTION,
; lower-cased, with its type inferred from the value. That is what lets a
; tool gain a tunable without the core learning about it.
;
; TargetPlane lets a tool write a named non-colour plane instead of colour.
; That is how an addon ships, say, a terrain-height brush and inherits the
; whole brush engine -- spacing, selection clipping, undo -- for free.
; ============================================================

[Tool:pencil]
Cursor     = blank
Footprint  = square
Class      = pencil
Label      = Pencil
Order      = 10
; Never antialiased, deliberately. On a 60x60 sprite a soft edge is a defect,
; and a pixel artist needs to know exactly which pixels changed.
size       = 1

[Tool:brush]
Cursor     = blank
Footprint  = circle
Class      = brush
Label      = Paintbrush
Order      = 20
size       = 16
; 1.0 is a hard edge with a single pixel of antialiasing; lower ramps the
; falloff inward from the rim.
hardness   = 0.85
; Dab spacing as a fraction of brush diameter. Lower is smoother and slower.
spacing    = 0.25
flow       = 1.0
pressure_size = on

[Tool:eraser]
Cursor     = blank
Footprint  = circle
Class      = eraser
Label      = Eraser
Order      = 30
size       = 16
hardness   = 0.85
spacing    = 0.25

[Tool:bucket]
Cursor     = pointing
Footprint  = none
Class      = bucket
Label      = Paint Bucket
Order      = 40
; Compared with Paint.NET's alpha-aware metric, not Euclidean RGB distance:
; transparent regions match loosely, opaque ones strictly.
tolerance  = 32

[Tool:eyedropper]
Cursor     = cross
Footprint  = point
Class      = eyedropper
Label      = Color Picker
Order      = 50

[Tool:select_rect]
Cursor     = cross
Footprint  = none
Class      = select_rect
Label      = Rectangle Select
Order      = 60
antialias  = on

[Tool:select_ellipse]
Cursor     = cross
Footprint  = none
Class      = select_ellipse
Label      = Ellipse Select
Order      = 70
antialias  = on

[Tool:lasso]
Cursor     = cross
Footprint  = none
Class      = lasso
Label      = Lasso Select
Order      = 80
antialias  = on

[Tool:magic_wand]
Cursor     = pointing
Footprint  = point
Class      = magic_wand
Label      = Magic Wand
Order      = 90
tolerance  = 32
; off = contiguous (GIMP's Fuzzy Select). on = every similar pixel anywhere
; (GIMP's Select by Color). Shift inverts whichever is set, per Paint.NET.
global     = off
feather    = 0

; ---- shapes -------------------------------------------------------------
; Shapes redraw from scratch on every mouse-move, restoring from the stroke
; session's scratch buffer first. That buffer is also what becomes the undo
; entry, so the rubber-band preview and the committed result are the same
; pixels and cannot disagree.
;
; style: outline | fill | both.
;   outline  strokes with the primary colour
;   fill     fills with the primary colour -- it is the one the user picked
;   both     outline in primary, fill in SECONDARY, so a two-colour shape
;            is a single drag rather than two
; Shift constrains (square/circle, or 15-degree angles for a line);
; Alt draws from the centre. Both are read live, so toggling mid-drag works.

[Tool:line]
Cursor     = cross
Footprint  = none
Class     = line
Label     = Line
Order     = 100
stroke    = 2
style     = outline
antialias = on

[Tool:rectangle]
Cursor     = cross
Footprint  = none
Class     = rectangle
Label     = Rectangle
Order     = 110
stroke    = 2
style     = both
antialias = on

[Tool:ellipse]
Cursor     = cross
Footprint  = none
Class     = ellipse
Label     = Ellipse
Order     = 120
stroke    = 2
style     = both
antialias = on

[Tool:freeform]
Cursor     = cross
Footprint  = none
Class     = freeform
Label     = Freeform Shape
Order     = 130
stroke    = 2
style     = outline
antialias = on

; ---- gradient -----------------------------------------------------------
; kind:   linear | reflected | diamond | radial | conical
; repeat: clamp | repeat | reflect
;
; alpha_only gradients the ALPHA channel and leaves colour untouched, which
; turns the tool into a soft mask. Most editors do not have this.
;
; The colour ramp is interpolated with alpha weighting, not a per-channel
; lerp: fading to a transparent colour must not drag that colour into the
; visible end of the ramp.

[Tool:gradient]
Cursor     = cross
Footprint  = none
Class      = gradient
Label      = Gradient
Order      = 140
kind       = linear
repeat     = clamp
alpha_only = off
reverse    = off

; ---- text ---------------------------------------------------------------
; Rasterised in the ENGINE via Pillow's FreeType, not in the UI. The design
; document assumed Qt would have to do this; Pillow is already an engine
; dependency, so text stays headless and scriptable and the engine stays
; Qt-free.
;
; Unlike the shapes, the text session stays OPEN after mouse-up: on_end
; finishes positioning, and the caller keeps editing with set_text() before
; calling commit_text(). Live preview works the same way the shapes' does,
; so what you see while typing is exactly what gets committed.
;
; font is a family name resolved through fontconfig (so "sans-serif" works),
; a face filename, or an absolute path.

[Tool:text]
Cursor     = ibeam
Footprint  = none
Class        = text
Label        = Text
Order        = 150
font         = DejaVu Sans
size         = 24
align        = left
line_spacing = 1.0
antialias    = on
text         =

; ---- clone and move -----------------------------------------------------
; Clone samples from a SNAPSHOT taken when the stroke begins, not from the
; live layer. Photoshop samples live, which lets a stroke feed on what it
; just painted -- occasionally useful, frequently a runaway smear when source
; and destination overlap. Freezing it per stroke keeps the result
; predictable; earlier strokes are still visible to later ones.
;
; aligned=on keeps the source offset fixed across strokes, so a clone can be
; built up in several passes. off re-anchors on every stroke.

[Tool:clone]
Cursor     = blank
Footprint  = circle
Class    = clone
Label    = Clone Stamp
Order    = 160
size     = 24
hardness = 0.8
spacing  = 0.15
aligned  = on

; Two move tools, deliberately separate. They look identical and do entirely
; different things -- one repositions the marquee, the other repositions
; image content -- and merging them is how people destroy work by accident.
;
; cut=on lifts the pixels, leaving a hole. off copies them instead.
; Shift constrains to the dominant axis, read live.

[Tool:move_pixels]
Cursor     = move
Footprint  = none
Class = move_pixels
Label = Move Selected Pixels
Order = 170
cut   = on

[Tool:move_selection]
Cursor     = move
Footprint  = none
Class = move_selection
Label = Move Selection
Order = 180
