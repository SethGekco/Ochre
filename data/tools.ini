; ============================================================
; Tools: which are offered, in what order, and with what defaults.
;
; Class= names the implementation. A section naming a Class that does not
; exist is silently skipped, so an addon's tool simply is not offered when
; the addon is absent -- rather than the editor refusing to start.
;
; Any key that is not Class/Label/Order/TargetPlane becomes a tool OPTION,
; lower-cased, with its type inferred from the value. That is what lets a
; tool gain a tunable without the core learning about it.
;
; Group= puts tools behind one toolbox button with a flyout for the
; rest (give a tool its own group to show it alone). Icon= names a drawn
; icon in ochre/ui/icons.py, or a PNG/SVG in data/icons/ that replaces it.
;
; Shortcut= selects the tool from the keyboard. Single letters follow
; Paint.NET where it has one, so muscle memory carries over. Shortcuts
; are inert while a text box is being typed into.
;
; TargetPlane lets a tool write a named non-colour plane instead of colour.
; That is how an addon ships, say, a terrain-height brush and inherits the
; whole brush engine -- spacing, selection clipping, undo -- for free.
; ============================================================

[Tool:pencil]
Group      = paint
Icon       = pencil
Shortcut   = P
Cursor     = blank
Footprint  = square
Class      = pencil
Label      = Pencil
Order      = 81
; Never antialiased, deliberately. On a 60x60 sprite a soft edge is a defect,
; and a pixel artist needs to know exactly which pixels changed.
size       = 1

[Tool:brush]
Group      = paint
Icon       = brush
Shortcut   = B
Cursor     = blank
Footprint  = circle
Class      = brush
Label      = Paintbrush
Order      = 80
size       = 16
; 1.0 is a hard edge with a single pixel of antialiasing; lower ramps the
; falloff inward from the rim.
hardness   = 0.85
; Dab spacing as a fraction of brush diameter. Lower is smoother and slower.
spacing    = 0.25
flow       = 1.0
pressure_size = on

[Tool:eraser]
Group      = eraser
Icon       = eraser
Shortcut   = E
Cursor     = blank
Footprint  = circle
Class      = eraser
Label      = Eraser
Order      = 100
size       = 16
hardness   = 0.85
spacing    = 0.25

[Tool:bucket]
Group      = fill
Icon       = bucket
Shortcut   = F
Cursor     = pointing
Footprint  = none
Class      = bucket
Label      = Paint Bucket
Order      = 110
; Compared with Paint.NET's alpha-aware metric, not Euclidean RGB distance:
; transparent regions match loosely, opaque ones strictly.
tolerance  = 32

[Tool:eyedropper]
Group      = picker
Icon       = eyedropper
Shortcut   = K
Cursor     = cross
Footprint  = point
Class      = eyedropper
Label      = Color Picker
Order      = 60

