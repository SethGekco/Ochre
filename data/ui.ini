; ============================================================
; UI settings. Same precedence rule as everything else:
;   built-in DEFAULTS  <  this file  <  OCHRE_<KEY> env var
; The defaults live in ochre/ui/config.py, where the dict IS the schema.
; ============================================================

[Window]
Width  = 1280
Height = 800
Title  = Ochre

[Canvas]
CheckerSize      = 16
CheckerLight     = 200,200,200
CheckerDark      = 160,160,160

; Zoom percentage at or above which a per-pixel grid is drawn. Pixel art
; wants it; a photo at 200% does not -- hence a threshold, not a toggle.
PixelGridAbove   = 800
GridColour       = 128,128,128,90

; Repaints are coalesced on this interval. Without coalescing, tiles
; completing at high frequency drown the UI thread and a multithreaded
; render ends up SLOWER than a single-threaded one.
RepaintMs        = 16
BackgroundColour = 60,62,68

[Tools]
DefaultTool = brush
